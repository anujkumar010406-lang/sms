{% extends 'teacherbase.html' %}
{% load static %}


{% block teacher %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Add Attendance</h1>
        {% if msg %}
        <div class="alert alert-danger" role="alert">
            {{msg}}
            <button type="button" class="btn-close" data-bs-dissmiss="alert" area-label="close"></button>
        </div>
        {% endif %}
        <table class="table">
            <tr>
                <th>S. No</th>
                <th>Rollno</th>
                <th>Name</th>
                <th>Class</th>
                <th>Attendance</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            {% for s in st %}
            <form method="post">
                {% csrf_token %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>
                    <input type="text"name="rollno" value="{{s.rollno}}" readonly>
                    <input type="text"name="sid" value="{{s.id}}" hidden readonly>
                    
                    </td>
                    <td><input type="text" name="name" value="{{s.name}}"> </td>
                <td>{{s.sclass}}</td>
                <td>
                    <select name="status" class="form-select">
                        <option value="A">Absent</option>
                        <option value="p">Present</option>
                    </select>
                </td>
                <td>
                    <input type="date" name="created_date" class="form-control" required>
                </td>
                <td>
                    <button type="submit" class="btn  btn-success">Mark</button>
                </td>
            </tr>
           </form>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
