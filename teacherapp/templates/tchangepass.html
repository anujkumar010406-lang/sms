{% extends 'teacherbase.html' %}
{% load static %}


{% block teacher %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Change Password</h1>
        <form method="post">
            {% csrf_token %}
            {% if msg %}
            <p class="text-light">{{msg}}</p>
            {% endif %}
            <table class="table">

                <tr>
                    <td>Enter old Password</td>
                    <td>
                        <input type="text" name="oldpassword" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Enter New Password</td>
                    <td>
                        <input type="text" name="newpassword" class="form-control">
                    </td>
                </tr>

                <tr>
                    <td>Enter Conform Password</td>
                    <td>
                        <input type="text" name="cnfpassword" class="form-control">
                    </td>
                </tr>
            </table>
            <div class="text-center">
                <button class="btn btn-warning">Change</button>
            </div>


        </form>
    </div>
</div>
{% endblock %}
